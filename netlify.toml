# Netlify hosts the React website (client/). The Express analysis API (server/)
# must run on an always-on Node host (e.g. Render) — set VITE_API_URL to its URL.
[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Public values (they are shipped to every browser). Never put the service-role key here.
  VITE_SUPABASE_URL = "https://lxmpqprsopkdnfwanddr.supabase.co"
  VITE_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Ii9sjoecCgxyMejocySEqw_TNuexqbI"
  # Set VITE_API_URL in the Netlify UI to your Render API URL once it is deployed.

# Single-page app: let React Router handle deep links like /review or /runs/12
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
